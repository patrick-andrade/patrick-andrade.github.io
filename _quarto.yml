lang: pt-BR

website:
  title: "Patrick Andrade"
  site-url: "https://patrick-andrade.github.io"
  description: "Patrick Rodrigues Andrade, professor do Departamento de Economia da PUC-SP. Economia política, políticas públicas e análise de dados."
  favicon: favicon.svg
  twitter-card:
    card-style: summary_large_image
    image: images/og-card.png
  open-graph:
    locale: pt_BR
    site-name: Patrick Andrade
    image: images/og-card.png
    image-width: 1200
    image-height: 630
    image-alt: "Patrick Rodrigues Andrade, Departamento de Economia, PUC-SP"
  navbar:
    left:
      - text: "Início"
        href: index.qmd
      - text: "Projetos"
        href: projetos.qmd
      - text: "Publicações"
        href: publicacoes.qmd
      - text: "Ensino"
        href: ensino.qmd
      - text: "Guias"
        href: guias.qmd
    right:
      - icon: github
        href: https://github.com/patrick-andrade
      - icon: linkedin
        href: https://www.linkedin.com/in/pkandrade/
      - text: Scholar
        href: https://scholar.google.com/citations?user=zWp0WH8AAAAJ&hl=pt-BR
  page-footer:
    left: "Patrick Rodrigues Andrade"
    right:
      - text: Scholar
        href: https://scholar.google.com/citations?user=zWp0WH8AAAAJ&hl=pt-BR
      - text: Lattes
        href: http://lattes.cnpq.br/5674238029128427
      - icon: github
        href: https://github.com/patrick-andrade
      - icon: linkedin
        href: https://www.linkedin.com/in/pkandrade/

format:
  html:
    theme:
      light: [cosmo, theme.scss]
